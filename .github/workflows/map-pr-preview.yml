name: map-pr-preview

# Community-map pipeline, phase 4: when a PR adds/changes maps/community/*.map,
# comment with a rendered top-down preview + the lint verdict, so review is
# visual ("that's a fun layout") instead of reading ASCII grids.
#
# SECURITY: pull_request_target runs with a write token in the BASE repo
# context, so we NEVER execute anything from the PR. All code (lint, renderer)
# comes from main via the default checkout; the PR contributes *.map DATA files
# only, checked out path-restricted. .map files are parsed, never executed.
on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - 'maps/community/**'

permissions:
  contents: write        # push preview PNGs to the map-previews branch
  pull-requests: write   # upsert the preview comment

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4     # trusted code from the BASE repo (main)
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pull the PR's .map files (data only, path-restricted)
        id: files
        run: |
          set -euo pipefail
          git fetch origin "pull/${{ github.event.pull_request.number }}/head"
          # Only .map data files under maps/community/ cross the trust boundary.
          CHANGED=$(git diff --name-only --diff-filter=AM HEAD FETCH_HEAD -- 'maps/community/*.map')
          if [ -z "$CHANGED" ]; then
            echo "changed=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$CHANGED" | while read -r f; do
            git checkout FETCH_HEAD -- "$f"
          done
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED"     >> "$GITHUB_OUTPUT"
          echo "EOF"          >> "$GITHUB_OUTPUT"

      - name: Lint the contributed maps
        if: steps.files.outputs.changed != ''
        id: lint
        run: |
          set -uo pipefail
          OUT=$(python3 tools/lint_maps.py 2>&1); RC=$?
          {
            echo "verdict<<EOF"
            echo "$OUT" | tail -20
            echo "EOF"
            echo "rc=$RC"
          } >> "$GITHUB_OUTPUT"
          exit 0    # the ci workflow is the enforcement gate; this one only reports

      - name: Render previews + push to the map-previews branch
        if: steps.files.outputs.changed != ''
        id: render
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pip install --quiet pillow
          mkdir -p /tmp/previews
          IMGS=""
          while read -r f; do
            [ -f "$f" ] || continue
            slug=$(basename "$f" .map)
            if python3 tools/render_map_png.py "$f" "/tmp/previews/${slug}.png" --cell 16; then
              IMGS="$IMGS ${slug}"
            fi
          done <<< "${{ steps.files.outputs.changed }}"

          if [ -z "$IMGS" ]; then echo "urls=" >> "$GITHUB_OUTPUT"; exit 0; fi

          # Publish PNGs on an orphan branch so raw.githubusercontent can serve
          # them in the comment. One folder per PR; force-push per update.
          git config user.name  "map-preview-bot"
          git config user.email "actions@github.com"
          git checkout --orphan _previews_tmp 2>/dev/null || git checkout _previews_tmp
          git fetch origin map-previews 2>/dev/null && git reset --soft FETCH_HEAD || git rm -rf --cached . -q || true
          mkdir -p "previews/pr-$PR"
          cp /tmp/previews/*.png "previews/pr-$PR/"
          git add -f "previews/pr-$PR"
          git commit -q -m "previews for PR #$PR" || true
          git push -f origin HEAD:map-previews

          SHA=$(git rev-parse HEAD)
          URLS=""
          for s in $IMGS; do
            URLS="$URLS![${s}](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/previews/pr-${PR}/${s}.png)%0A"
          done
          {
            echo "imgs<<EOF"
            for s in $IMGS; do
              echo "### \`$s\`"
              echo "![${s}](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/previews/pr-${PR}/${s}.png)"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert the preview comment
        if: steps.files.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LINT_ICON=$([ "${{ steps.lint.outputs.rc }}" = "0" ] && echo "✅ lint passed" || echo "❌ lint FAILED")
          BODY=$(cat <<COMMENT_EOF
          <!-- map-preview-bot -->
          ## 🗺️ Map preview

          ${{ steps.render.outputs.imgs }}

          **${LINT_ICON}**
          \`\`\`
          ${{ steps.lint.outputs.verdict }}
          \`\`\`

          _The **ci / build** check compiles this map — grab the \`backrooms-32x-community\` artifact from that run to play it before merging. Community maps ship in \`backrooms-community.32x\` and in your own \`backrooms-<name>.32x\`, both attached to every \`build-N\` release; the maintainer promotes maps into the main ROM by hand._
          COMMENT_EOF
          )
          # Update the bot's existing comment if present, else create it.
          CID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                --jq '.[] | select(.body | startswith("<!-- map-preview-bot -->")) | .id' | head -1)
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${CID}" -f body="$BODY" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY" >/dev/null
          fi
          echo "commented on PR #$PR"
